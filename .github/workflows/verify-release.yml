name: Verify 2.4.5
on:
  push:
    branches: [release/publish-2.4.5]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 979b8861867e4f3371f9a2f1b674269da1da9a17
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Ruff
        run: pipx run --spec ruff==0.14.5 ruff check service.sudosync tests tools --statistics
