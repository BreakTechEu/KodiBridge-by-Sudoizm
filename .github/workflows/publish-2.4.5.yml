name: Update 2.4.5 release notes
on:
  push:
    branches: [release/publish-2.4.5]
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Edit release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit 2.4.5 --repo BreakTechEu/KodiBridge-by-Sudoizm --notes-file - <<'NOTES'
          ### Polski
          KodiBridge pokazuje komunikaty po skanowaniu biblioteki, podczas synchronizacji i zapisywania snapshotu. W ustawieniach dodatku można wybrać „Zamknij Kodi po zakończeniu pracy KodiBridge” i anulować oczekiwanie. Podłączenie tej akcji do przycisku „Wyjdź” w Estuary wymaga [opcjonalnej łatki skórki](https://github.com/BreakTechEu/KodiBridge-by-Sudoizm/blob/2.4.5/docs/estuary-safe-quit.patch).
          
          ### English
          KodiBridge displays activity after a library scan, during synchronization and while saving a snapshot. In the add-on settings, choose “Exit Kodi when KodiBridge finishes” to wait for the current operation. You can cancel the wait. To use this action from Estuary’s Exit button, apply the [optional skin patch](https://github.com/BreakTechEu/KodiBridge-by-Sudoizm/blob/2.4.5/docs/estuary-safe-quit.patch).
          NOTES
